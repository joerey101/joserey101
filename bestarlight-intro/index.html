<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestarlight — Intro v1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Inter', sans-serif; overflow: hidden; }

    #intro-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9999;
    }
    #bloom {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #ffffff;
      z-index: 10000; opacity: 0; pointer-events: none;
      transition: none;
    }
    #logo-container {
      position: fixed; top: 36px; left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 10001; opacity: 0;
      text-align: center; pointer-events: none;
      white-space: nowrap; display: flex;
      align-items: center; gap: 10px;
    }
    #logo-container .star-icon {
      font-size: 1.2rem; color: #111;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.15));
      animation: pulse-star 2.5s ease-in-out infinite;
    }
    #logo-container .logo-text {
      font-size: 1.3rem; font-weight: 700;
      color: #0d0d0d;
      letter-spacing: 0.25em;
    }
    @keyframes pulse-star {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    /* ——— Placeholder web content ——— */
    #web-content {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0; z-index: 9998;
      background: #ffffff;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #111; gap: 16px;
    }
    #web-content h1 {
      font-size: 2.5rem; font-weight: 300;
      letter-spacing: 0.15em; opacity: 0.88;
      color: #0d0d0d;
    }
    #web-content p  {
      font-size: 0.9rem; letter-spacing: 0.22em;
      opacity: 0.38; text-transform: uppercase;
      color: #333;
    }
    .web-divider {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.2), transparent);
    }

    /* ——— Replay button ——— */
    #replay {
      position: fixed; bottom: 24px; right: 24px; z-index: 10002;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); padding: 8px 18px; border-radius: 20px;
      cursor: pointer; font-size: 0.8rem; letter-spacing: 0.1em;
      opacity: 0; backdrop-filter: blur(10px); transition: background 0.2s, color 0.2s;
    }
    #replay:hover { background: rgba(255,255,255,0.16); color: white; }
  </style>
</head>
<body>

<canvas id="intro-canvas"></canvas>
<div id="bloom"></div>

<div id="logo-container">
  <span class="star-icon">✦</span>
  <span class="logo-text">STARLIGHT</span>
</div>

<div id="web-content">
  <h1>bestarlight</h1>
  <div class="web-divider"></div>
  <p>Comunicación · Marketing · Sistemas</p>
</div>

<button id="replay">↺ Repetir intro</button>

<script>
// ============================================================
// BESTARLIGHT — Intro Supernova v1 (original)
// ============================================================

const canvas  = document.getElementById('intro-canvas');
const ctx     = canvas.getContext('2d');
const bloom   = document.getElementById('bloom');
const logoCon = document.getElementById('logo-container');
const webCon  = document.getElementById('web-content');
const replayBtn = document.getElementById('replay');

// ---- TIMING (ms) ----
const T = {
  STARS_FADE_IN  :  900,   // estrellas aparecen
  STARS_LIVE     : 2500,   // espacio vive con titileo antes de la luz
  STAR_GROW_END  : 3500,   // estrella central crece
  BLOOM_PEAK     : 3820,
  BLOOM_END      : 4250,
  REVEAL_END     : 5400,
};

// ---- HELPERS ----
const clamp        = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp         = (a, b, t) => a + (b - a) * t;
const norm         = (v, mn, mx) => clamp((v - mn) / (mx - mn), 0, 1);
const easeInExpo   = t => t === 0 ? 0 : Math.pow(2, 10 * t - 10);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

let W, H, cx, cy;
function resize() {
  canvas.width  = W = window.innerWidth;
  canvas.height = H = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', () => { resize(); generateStars(); });
resize();

// ============================================================
// GENERADORES
// ============================================================
let stars = [];
let brightStars = [];  // estrellas destacadas con titileo dramático
let nodes = [];

function generateStars(count = 380) {
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x            : Math.random() * W,
      y            : Math.random() * H,
      r            : Math.random() * 1.4 + 0.3,
      baseOpacity  : Math.random() * 0.65 + 0.15,
      twinkleSpeed : Math.random() * 0.015 + 0.004,
      twinklePhase : Math.random() * Math.PI * 2,
      depth        : Math.random() * 0.8 + 0.2,
    });
  }

  // Estrellas brillantes — titilan de forma dramática y visible
  brightStars = [];
  const bCount = 28;
  for (let i = 0; i < bCount; i++) {
    // Evitar el centro donde nace la estrella principal
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (Math.hypot(x - W/2, y - H/2) < Math.min(W, H) * 0.18);

    brightStars.push({
      x,
      y,
      r            : Math.random() * 1.8 + 0.8,
      // Titileo: algunas muy dramáticas (casi desaparecen), otras más suaves
      minOp        : Math.random() < 0.4 ? 0.02 : 0.2,
      maxOp        : Math.random() * 0.5 + 0.5,
      twinkleSpeed : Math.random() * 0.008 + 0.003,
      twinklePhase : Math.random() * Math.PI * 2,
      // Desfase de entrada — no todas aparecen al mismo tiempo
      delayNorm    : Math.random() * 0.6,
      // Algunas tienen destello tipo "spike" (cruz de 4 puntas)
      hasSpike     : Math.random() < 0.35,
      spikeLen     : Math.random() * 8 + 4,
      spikeRot     : Math.random() * Math.PI,
    });
  }
}

function generateNodes(count = 12) {
  nodes = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    nodes.push({
      baseAngle  : angle,
      baseDist   : 18 + Math.random() * 14,
      orbitSpeed : (Math.random() - 0.5) * 0.008,
      phase      : Math.random() * Math.PI * 2,
      r          : 1.2 + Math.random() * 1.2,
    });
  }
}

// ============================================================
// DRAW LOOP
// ============================================================
let startTime  = null;
let animFrame  = null;

function draw(timestamp) {
  if (!startTime) startTime = timestamp;
  const e  = timestamp - startTime;
  const cx = W / 2;
  const cy = H / 2;

  const pStars  = easeOutCubic(norm(e, 0, T.STARS_FADE_IN));
  const pGrow   = easeInExpo(norm(e, T.STARS_LIVE, T.STAR_GROW_END));
  const pBloomUp= norm(e, T.STAR_GROW_END, T.BLOOM_PEAK);
  const pBloomDn= easeOutCubic(norm(e, T.BLOOM_PEAK, T.BLOOM_END));
  const pReveal = easeOutCubic(norm(e, T.BLOOM_END, T.REVEAL_END));

  // ---- CLEAR ----
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);

  // ---- STARS DE FONDO ----
  const starFade = 1 - pGrow * 0.85;
  stars.forEach(s => {
    const tw = Math.sin(e * s.twinkleSpeed + s.twinklePhase) * 0.25 + 0.75;
    const op = s.baseOpacity * tw * pStars * starFade;
    if (op <= 0) return;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.depth, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${op})`;
    ctx.fill();
  });

  // ---- ESTRELLAS BRILLANTES con titileo dramático ----
  brightStars.forEach(s => {
    // Entrada escalonada — cada una aparece en su propio momento
    const pEntry = easeOutCubic(norm(pStars, s.delayNorm, s.delayNorm + 0.4));
    if (pEntry <= 0) return;

    // Titileo más pronunciado — oscila entre minOp y maxOp
    const twRaw = (Math.sin(e * s.twinkleSpeed + s.twinklePhase) + 1) / 2;
    const op    = lerp(s.minOp, s.maxOp, twRaw) * pEntry * starFade;
    if (op < 0.01) return;

    // Punto central
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${op})`;
    ctx.fill();

    // Halo suave
    const halo = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3.5);
    halo.addColorStop(0, `rgba(200,230,255,${op * 0.4})`);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 3.5, 0, Math.PI * 2);
    ctx.fillStyle = halo;
    ctx.fill();

    // Spike (destello de 4 puntas) — solo cuando está brillante
    if (s.hasSpike && twRaw > 0.5) {
      const spikeOp  = (twRaw - 0.5) * 2 * op * 0.8;
      const spikeLen = s.spikeLen * twRaw;
      [0, Math.PI / 2].forEach(angle => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.spikeRot + angle);
        const sg = ctx.createLinearGradient(-spikeLen, 0, spikeLen, 0);
        sg.addColorStop(0,   'rgba(255,255,255,0)');
        sg.addColorStop(0.5, `rgba(255,255,255,${spikeOp})`);
        sg.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.moveTo(-spikeLen, 0);
        ctx.lineTo(spikeLen, 0);
        ctx.strokeStyle = sg;
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.restore();
      });
    }
  });

  // ---- ESTRELLA CENTRAL ----
  if (e < T.BLOOM_PEAK) {
    const starR  = lerp(3.5, Math.min(W, H) * 0.55, pGrow);
    const glowR  = starR * 2.2;
    const coreOp = 1 - pBloomUp * 0.3;

    // Glow exterior difuso
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    grd.addColorStop(0,   `rgba(255, 245, 200, ${0.55 * coreOp})`);
    grd.addColorStop(0.25,`rgba(160, 200, 255, ${0.3  * coreOp})`);
    grd.addColorStop(0.6, `rgba(80,  120, 255, ${0.12 * coreOp})`);
    grd.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Núcleo brillante
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, starR);
    core.addColorStop(0,   `rgba(255,255,255,${coreOp})`);
    core.addColorStop(0.4, `rgba(255, 230, 140, ${0.85 * coreOp})`);
    core.addColorStop(1,   'rgba(255,180,80,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, starR, 0, Math.PI * 2);
    ctx.fillStyle = core;
    ctx.fill();

    // Rayos de luz
    if (pGrow > 0.25) {
      const rayOp  = norm(pGrow, 0.25, 0.6) * coreOp;
      const rotation  = e * 0.00015;
      const rayAngles = [0, 0.5, 1, 1.5, 0.25, 0.75, 1.25, 1.75].map(v => v * Math.PI);

      rayAngles.forEach((angle, i) => {
        const isPrimary = i < 4;
        const len = starR * (isPrimary ? 2.0 : 1.1);
        const w   = isPrimary ? 2.5 : 1.0;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + rotation);

        const rayGrd = ctx.createLinearGradient(0, 0, len, 0);
        rayGrd.addColorStop(0,   `rgba(255,255,255,${0.85 * rayOp})`);
        rayGrd.addColorStop(0.5, `rgba(200,230,255,${0.3  * rayOp})`);
        rayGrd.addColorStop(1,   'rgba(255,255,255,0)');

        ctx.beginPath();
        ctx.moveTo(0, -w / 2);
        ctx.lineTo(len, 0);
        ctx.lineTo(0,  w / 2);
        ctx.fillStyle = rayGrd;
        ctx.fill();
        ctx.restore();
      });
    }

    // Nodos (red neuronal)
    const nodesOp = Math.sin(norm(pGrow, 0.05, 0.9) * Math.PI) * coreOp;
    if (nodesOp > 0.01) {
      nodes.forEach((n, i) => {
        const angle = n.baseAngle + n.orbitSpeed * e + Math.sin(e * 0.001 + n.phase) * 0.4;
        const dist  = n.baseDist + starR * 0.45 + Math.sin(e * 0.002 + n.phase) * 6;
        const nx = cx + Math.cos(angle) * dist;
        const ny = cy + Math.sin(angle) * dist;

        // Línea nodo → centro
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(nx, ny);
        ctx.strokeStyle = `rgba(160, 210, 255, ${0.45 * nodesOp})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();

        // Línea nodo → nodo adyacente
        const next = nodes[(i + 1) % nodes.length];
        const na = next.baseAngle + next.orbitSpeed * e;
        const nd = next.baseDist + starR * 0.45;
        ctx.beginPath();
        ctx.moveTo(nx, ny);
        ctx.lineTo(cx + Math.cos(na) * nd, cy + Math.sin(na) * nd);
        ctx.strokeStyle = `rgba(160, 210, 255, ${0.15 * nodesOp})`;
        ctx.lineWidth = 0.3;
        ctx.stroke();

        // Punto nodo
        ctx.beginPath();
        ctx.arc(nx, ny, n.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210, 235, 255, ${nodesOp})`;
        ctx.fill();
      });
    }
  }

  // ---- BLOOM SUPERNOVA ----
  const bloomPeak = clamp(pBloomUp, 0, 1);
  const bloomFade = e < T.BLOOM_END ? clamp(bloomPeak - pBloomDn * bloomPeak, 0, 1) : 0;
  bloom.style.opacity = bloomFade;

  // ---- CANVAS FADE — desaparece junto con el bloom, sin negro ----
  // Apenas el bloom empieza a bajar, el canvas baja con él
  if (e >= T.BLOOM_PEAK) {
    canvas.style.opacity = Math.max(0, 1 - easeOutCubic(norm(e, T.BLOOM_PEAK, T.BLOOM_END)));
  }

  // ---- REVEAL: Logo + Web (sobre fondo blanco) ----
  if (e >= T.BLOOM_PEAK) {
    webCon.style.opacity  = easeOutCubic(norm(e, T.BLOOM_PEAK, T.REVEAL_END));
    const pLogo = easeOutCubic(norm(e, T.BLOOM_END, T.REVEAL_END));
    logoCon.style.opacity   = pLogo;
    logoCon.style.transform = `translateX(-50%) translateY(${lerp(-10, 0, pLogo)}px)`;
  }

  if (e < T.REVEAL_END + 600) {
    animFrame = requestAnimationFrame(draw);
  } else {
    canvas.style.display = 'none';
    replayBtn.style.transition = 'opacity 0.5s';
    replayBtn.style.opacity = '1';
  }
}

// ============================================================
// INIT
// ============================================================
function init() {
  canvas.style.display = 'block';
  canvas.style.opacity = '1';
  canvas.style.transition = 'none';
  bloom.style.opacity   = '0';
  logoCon.style.opacity = '0';
  logoCon.style.transform = 'translateX(-50%) translateY(-10px)';
  webCon.style.opacity  = '0';
  replayBtn.style.opacity = '0';

  startTime = null;
  if (animFrame) cancelAnimationFrame(animFrame);

  generateStars(380);
  generateNodes(12);

  animFrame = requestAnimationFrame(draw);
}

replayBtn.addEventListener('click', init);
init();
</script>
</body>
</html>
